# Base template for map generator
#
general:
  id: 3               # id in rane 0 - ...
  seed: 12345         # seed in range 0 - ...
  type: island        # island,  ...
  climate: temperate  # temperate, ...
  rivers: few         # few, ...
  river-size: small   # small, ...
  hills: few          # few, ...
  hills-size: small   # small, ...
  lakes: few          # few, ...
  lakes-size: small   # small, ...
  scale: medium       # medium, ...
  ruggedness: rolling # rolling, ..

# Things built into the terrain, placed by hand in the previewer, in map pixels
# -- a quarter of a cell at the default 1024. An item is part of the world,
# so genmap.py terraforms it straight into the two maps.
#
# **Only terrain goes here.** This file describes a world; who is standing in
# it, and why, belongs to a mission -- two rescues could be flown over this
# same island. The missions are in missions/, one file each, listed by campaign.yaml.
#
# Here is an example of every type implemented
items:
  - type: pyramid  
    x: 426
    y: 274
    size: medium      # medium, ... 
  - type: house  
    x: 226
    y: 174
    size: small      # small, ... 
 - road:
    from: 226,176
    to: 476,274
    
