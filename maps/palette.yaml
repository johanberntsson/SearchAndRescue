# The shared palette for every generated map.
#
# One index ramp, fixed for all maps and all climates: a colour map written by
# tools/genmap.py only ever holds indices from the bands below, so any two
# generated maps can share one palette upload and a mission can change climate
# without changing a single map byte.  What the climate changes is the *RGB
# behind* those indices, which is the only thing that has to be re-uploaded.
#
# Indices 0-15 are the system's and are never touched here: index 0 is the
# border and screen colour, 1 and 2 are the panel ink (a text character takes
# its colour from colour RAM, which is a four-bit field, so panel ink has to
# live down here), and the rest are left for the same kind of use.  224-239 are
# the sky gradient and 240/241 the reserved HUD pair; everything the bands below
# do not claim is the pool tools/convmap.py hands to the sprite sheets, fifteen
# entries to a figure.
#
# The land bands are contiguous and in ascending order on purpose: shore,
# lowland, highland and peak are one elevation ramp that genmap.py indexes with
# a single add, and the band boundaries only decide where the colours change
# character.  Keep them adjacent if you re-cut them.
#
# **A land band's `count` is elevation steps, and each step owns one entry per
# entry in `shades` below**, so the band spans `count * len(shades)` indices
# starting at `base`: step s, shade l is at `base + s * len(shades) + l`.  The
# ramp is therefore 21 elevation steps in 126 indices, which with the eight
# water shades leaves 74 free for the sprite pool -- four figures' worth.
#
# The hand-drawn map this budget was cut against uses 184 entries, so spending
# most of the palette on terrain is what it has always looked like; what is new
# is that the second dimension is *lighting* rather than more elevation.  Twenty
# one elevation steps against the forty there used to be is not a loss the eye
# can find, because the shading now carries the shape.

bands:
  # Water is shaded by depth, deepest at the first index -- and by nothing else:
  # a water surface is flat, so there is no normal for the sun to catch, and
  # these eight entries are eight indices rather than eight steps.
  water:    {base: 16, count: 8, shaded: false}
  # The land ramp, low to high: 21 elevation steps, 6 shades each, 24..149.
  shore:    {base: 24,  count: 3}
  lowland:  {base: 42,  count: 8}
  highland: {base: 90,  count: 6}
  peak:     {base: 126, count: 4}

# What the sun does to a band's colour, darkest face to brightest.  A multiplier
# below 1 scales the colour; above 1 it is a lerp that far toward white by
# (m - 1), because a snow peak has nowhere brighter to go and multiplying only
# clips it flat.  **Flat ground lands exactly on the 1.00 entry**, so the stops
# below are still the colours a level plain comes out in, and the shading only
# adds faces to either side of them.
#
# The range is measured off resources/C1W.png, whose shading spans about 0.45x
# to 1.35x within one elevation band -- so this is a strong effect, not a hint.
# Keep 1.00 at index len(shades)//2: genmap.py puts flat ground at the middle
# entry and does not look for the neutral one.
shades: [0.44, 0.62, 0.80, 1.00, 1.12, 1.24]

# Each climate gives every band a list of at least two RGB stops, interpolated
# evenly across the band's elevation steps.  The band names are shared, so their
# meaning is elevation, not vegetation: "lowland" is forest in a temperate
# climate, dry savannah in a hot one, and tundra in a cold one, and "peak" is
# snow in two of the three and sun-bleached rock in the other.
climates:
  temperate:
    water:    [[8, 24, 52], [58, 112, 148]]
    shore:    [[126, 116, 86], [196, 186, 150]]
    lowland:  [[40, 72, 36], [104, 128, 62]]
    highland: [[96, 104, 64], [122, 112, 96]]
    peak:     [[140, 138, 132], [246, 248, 252]]

  hot:
    water:    [[10, 40, 60], [70, 150, 170]]
    shore:    [[176, 158, 110], [226, 212, 166]]
    lowland:  [[122, 124, 64], [186, 172, 104]]
    highland: [[150, 110, 70], [190, 150, 104]]
    peak:     [[198, 166, 120], [236, 222, 196]]

  cold:
    water:    [[12, 28, 44], [72, 104, 124]]
    shore:    [[110, 110, 112], [166, 170, 176]]
    lowland:  [[54, 72, 58], [96, 106, 82]]
    highland: [[104, 106, 104], [150, 152, 156]]
    peak:     [[200, 206, 214], [255, 255, 255]]
